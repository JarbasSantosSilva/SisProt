{% extends 'base.html' %}

{% block title %}SisProt - Cadastro de Atendente{% endblock %}

{% block content %}
<div class="card">
  <h1>Cadastro de Atendente</h1>
  <form action="/cadastro_atendente" method="POST">
  <label for="nome">Nome:</label>
  <input type="text" id="nome" name="nome" required aria-required="true">

  <label for="cpf">CPF:</label>
  <input type="text" id="cpf" name="cpf" required aria-required="true">

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required aria-required="true">

  <label for="senha">Senha:</label>
  <input type="password" id="senha" name="senha" required aria-required="true">

  <button type="submit">Cadastrar Atendente</button>
</form>
</div>
{% endblock %}
