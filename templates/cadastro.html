{% extends 'base.html' %}

{% block title %}SisProt - Cadastro{% endblock %}

{% block content %}
<div class="card">
  <h1>Cadastro</h1>
  <form action="/cadastro" method="POST">
  <label for="nome">Nome:</label>
  <input type="text" id="nome" name="nome" required aria-required="true">

  <label for="cpf">CPF:</label>
  <input type="text" id="cpf" name="cpf" required aria-required="true">

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required aria-required="true">

  <label for="senha">Senha:</label>
  <input type="password" id="senha" name="senha" required aria-required="true">

  <button type="submit">Cadastrar</button>
</form>
</div>
<script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
{% endblock %}
